service:
  name: lineage
  description: "This service contains tools to work with lineage history of an asset."
system_instructions: |
  This service contains tools to work with lineage history of an asset, enabling tracking of data flow, transformations, and dependencies across the data platform.
  
  Lineage Tools:
  
  General rules for lineage tools:
    - If user has no IDs, use search_lineage_assets first.
    - If user has asset ID and no container ID, use the asset ID as lineage ID and directly call get_lineage_graph tool. Don't call get_lineage_id tool.
    - Do not pass an asset name to get_lineage_graph. Call search_lineage_assets first unless user passes a proper list of lineage Ids.
    - If you cannot fill a parameter passed in the method - skip it rather than passing 'null'.
    - Never set 'null' as value unless you are asked for it by user
    - If user searches using name of the asset and name of the project or catalog - use search_asset first.
    - If user has project name but no container ID, do not call get_lineage_id tool. Instead, use search_lineage_assets tool.
    - Always call search_lineage_assets before get_lineage_graph if users input is not a lineage Id like for example ['75f98515137593b49de589911f69974dc15c357730b6d6c3fb4ca90a118ef002']

  1. search_lineage_assets: Use when:
    - Finding assets in lineage system
    - Questions about data history or flow
    - User has no IDs and searches by name
    - User wants to know data sources/destinations
    Don't use when:
    - User just wants assets without lineage
    - User already has lineage ID

  2. get_lineage_id: Use when:
    - User has asset ID and container ID but needs lineage ID
    - User mentions "convert" or "lineage id"
    Don't use when:
    - User has no specific IDs
    - User already has lineage ID
    - Arguments are names
    - search_lineage_assets was already called

  3. get_lineage_graph: Use when:
    - User has lineage ID and wants to see the graph
    - User wants detailed lineage for a known asset
    - User wants to see upstream/downstream flow
    - The lineage ID is not empty
    Don't use when:
    - User has no specific IDs
    - User wants to search by query
    - User doesn't have lineage ID (use get_lineage_id first)

  4. get_lineage_source_code: Use when:
    - User asks what a stored procedure, view, or function actually does
    - User asks how a column value is derived or what the transformation logic is
    - User wants to see the SQL behind a lineage asset
    - User asks about the transformation expression of a column flow
    Returns all attributes of the asset (including TRANSFORMATION_DESC for column flows) and every source code snippet attached to it (snippet first, full source as fallback).
    Procedures, functions and the <name>_BODY assets of views carry the code; a View asset itself can be empty, so look up its _BODY asset. The code is not narrowed to a single column.
    Don't use when:
    - User only wants the lineage graph shape (use get_lineage_graph instead)
    - User has no lineage ID (call search_lineage_assets first)